# Minimal sysbuild config to build+flash the network core (cpunet) ipc_radio
# image alongside the app core image — required for BLE on nRF5340. Ported
# from nrf5340_firmware (originally copied from
# nrf/samples/bluetooth/peripheral_uart/sysbuild/ipc_radio/prj.conf's setup).
SB_CONFIG_NETCORE_IPC_RADIO=y
SB_CONFIG_NETCORE_IPC_RADIO_BT_HCI_IPC=y
