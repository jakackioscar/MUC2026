CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_MODE_IMMEDIATE=y
# Default 1024 B wraps fast enough at this project's ~100ms log cadence
# that J-Link RTT Viewer/JLinkRTTLogger can miss early boot lines before
# it finishes attaching. 16384 gives enough headroom that a normal
# attach delay never loses them.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=16384

# ── ADC->BLE pipeline (ported from nrf5340_firmware) ───────────────────────
# nrfx SAADC direct driver (sampling_source_nrfx.c) — not Zephyr's generic
# ADC API.
CONFIG_NRFX_SAADC=y
CONFIG_NRFX_TIMER=y
CONFIG_NRFX_GPPI=y
CONFIG_GPIO=y

CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# ── BLE ──────────────────────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Device_ADC"
CONFIG_BT_MAX_CONN=1

# NUS service
CONFIG_BT_NUS=y

# nRF5340: use host PRNG, not HCI for entropy (required on this SoC)
CONFIG_BT_HOST_CRYPTO_PRNG=y
CONFIG_ENTROPY_BT_HCI=n

# 247 is the standard "DLE-friendly" ATT MTU (fits a 251-byte Data Length
# Extension Link Layer PDU with L2CAP/ATT overhead). One ble_sm_packet
# fragment (see ble_sender.c's BLE_SM_SAMPLES_PER_PKT) is 216 bytes,
# comfortably under the 244-byte usable ATT payload this gives.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=10
# zephyr/include/zephyr/bluetooth/buf.h build-asserts EVT_RX_COUNT >
# ACL_TX_COUNT (controller needs a free HCI event buffer per in-flight
# ACL TX completion, plus normal connection/advertising events).
CONFIG_BT_BUF_EVT_RX_COUNT=16

# GATT client role + auto MTU exchange: we're a peripheral, but still need
# to actively request the ATT MTU above on connect — without this the link
# sits at BLE's default 23-byte MTU until something asks for more, and nRF
# Connect / most phones only respond, they don't always initiate first.
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y

# CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS defaults to y and re-requests
# connection parameters ~5s after every connect using whatever
# CONFIG_BT_PERIPHERAL_PREF_MIN_INT/MAX_INT say (Zephyr defaults: 30-50ms).
# Pinned here to match ble_sender.c's fast_conn_param
# (BT_LE_CONN_PARAM_INIT(8, 16, 0, 400)) so that automatic re-request
# agrees with connected()'s explicit one instead of undoing it.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=8
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=16
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Data Length Extension (bigger Link Layer PDUs) and 2M PHY, both
# negotiated automatically once enabled — PHY is also requested
# explicitly in ble_sender.c's connected() (CONFIG_BT_AUTO_PHY_UPDATE is
# deprecated in this Zephyr version).
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y

# DK LEDs: LED2 = BLE connection status (ble_sender.c)
CONFIG_DK_LIBRARY=y

# ── System ───────────────────────────────────────────────────────────────
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ASSERT=y

# LFXO (external 32.768kHz crystal), for BLE long-connection-interval power
# efficiency — nRF5340 DK / BT40F module both have it on-board.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
