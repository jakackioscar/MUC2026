# Network core (ipc_radio) config for nRF5340.
# Copied from nrf/samples/bluetooth/peripheral_uart/sysbuild/ipc_radio/prj.conf
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n

# hello_world/prj.conf's CONFIG_BT_USER_DATA_LEN_UPDATE/CONFIG_BT_AUTO_DATA_LEN_UPDATE
# only reach the app core's HOST stack — the netcore's SoftDevice
# Controller is a separate Kconfig namespace (separate binary) and needs
# this symbol set here too, or Data Length Extension never actually
# negotiates over the air. SDC (CONFIG_BT_CTLR_SDC_*, not Zephyr's
# software split controller) has no separate max-length knob — enabling
# this alone lets it use its full supported length (251 B).
CONFIG_BT_DATA_LEN_UPDATE=y

# Radio TX power: +3 dBm, the maximum the nRF5340 radio supports (default is
# 0 dBm). This is a controller option, so it belongs here with the network
# core's config, not in the application core's prj.conf.
CONFIG_BT_CTLR_TX_PWR_PLUS_3=y
